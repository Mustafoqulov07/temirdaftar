version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qarzdor-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qarzdorpassword
      POSTGRES_DB: qarzdor_db
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
